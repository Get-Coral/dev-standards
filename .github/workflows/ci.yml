name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: Validate packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 24
          cache: true

      - name: Build packages
        run: vp run build

      - name: Test
        run: vp run test

      - name: Lint, format, typecheck and verify package artifacts
        run: vp run check
